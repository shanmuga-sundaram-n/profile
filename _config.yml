title: "Shanmuga Sundaram Natarajan's Personal Website"
description: "A professional personal website with technical blogs."
author: Shanmuga Sundaram Natarajan
email: urmail2ss@gmail.com
baseurl: "" # GitHub Pages root directory
url: "https://shanmuga-sundaram-n.github.io"

# Disable default theme to use custom CSS
theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge

# Permalink structure
permalink: /blog/:year/:month/:day/:title/

# Pagination
paginate: 10
paginate_path: "/blog/page:num/"

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Social links
social_links:
  - name: "GitHub"
    url: "https://github.com/shanmuga-sundaram-n"
    icon: "fab fa-github"
  - name: "LinkedIn"
    url: "https://linkedin.com/in/shanmuga-sundaram-n"
    icon: "fab fa-linkedin"