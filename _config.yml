title: "Shan's Personal Website"
description: "A professional personal website with technical blogs."
author: Shan
email: your-email@example.com
baseurl: "" # Leave empty for root
url: "https://yourusername.github.io" # Update with your GitHub Pages URL

# Remove the theme reference since we will use a local theme
# theme: feeling-responsive

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge

# Navigation links
nav_links:
  - title: "Home"
    url: "/"
  - title: "Blog"
    url: "/blog/"
  - title: "About"
    url: "/about/"

# Social links (optional)
social_links:
  - name: "GitHub"
    url: "https://github.com/yourusername"
    icon: "fab fa-github"
  - name: "LinkedIn"
    url: "https://linkedin.com/in/yourusername"
    icon: "fab fa-linkedin"